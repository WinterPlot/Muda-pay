name: Create signing key (run once)

# Run this ONCE from the Actions tab (Run workflow). It creates the key that signs every MudaPay build,
# prints its SHA-1 (for Firebase) and gives you the 4 secret values in a private download.
# Keep the repository PRIVATE while you do this, and delete the download afterwards.
on: workflow_dispatch

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if a key already exists
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "A signing key is already configured (secret KEYSTORE_BASE64 exists). Not creating another one."
            exit 1
          fi

      - name: Generate the key
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore mudapay.keystore -storetype PKCS12 -alias mudapay \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MudaPay, OU=Mobile, O=MudaPay, C=BI"
          B64=$(base64 -w0 mudapay.keystore)
          echo "::add-mask::$B64"
          mkdir out
          {
            echo "KEYSTORE_BASE64=$B64"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=mudapay"
            echo "KEY_PASSWORD=$PASS"
          } > out/secrets.txt
          echo "=== Copy this SHA-1 into Firebase (Project settings > your Android app > Add fingerprint) ==="
          keytool -list -v -keystore mudapay.keystore -storepass "$PASS" | grep -E "SHA1|SHA-1"

      - name: Private download with the 4 secret values
        uses: actions/upload-artifact@v4
        with:
          name: MudaPay-signing-key-PRIVATE
          path: out/secrets.txt
          retention-days: 1
