name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Firebase config (optional, enables push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi

      - name: Signing key (optional, needed for Google sign-in)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > app/mudapay.keystore; fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDirectDebug :app:assemblePlayDebug --stacktrace

      - name: Show the APK's SHA-1 (register this in Google Cloud for Google sign-in)
        run: |
          for f in app/build/outputs/apk/*/debug/*.apk; do
            keytool -printcert -jarfile "$f" | grep -E "SHA1|SHA-1" || true
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MudaPay-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk

      # The file to upload to Google Play (needs the signing key secrets; skipped without them).
      - name: Build Google Play bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/mudapay.keystore ]; then gradle :app:bundlePlayRelease --stacktrace; else echo "No signing key: AAB skipped"; fi

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: MudaPay-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: ignore

      # Google Play requires 64-bit native libraries to support 16 KB memory pages. This fails the run and lists the
      # offending libraries (the name shows which SDK brings it: opencv, jnidispatch = JNA/Reown, mlkit, camera, ...).
      - name: Check 16 KB page size support
        run: |
          files=$(ls app/build/outputs/apk/play/debug/*.apk app/build/outputs/bundle/playRelease/*.aab 2>/dev/null || true)
          python3 tools/check_16kb.py $files

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports

      - name: Show duplicate classes
        if: failure()
        run: |
          gradle :app:checkDirectDebugDuplicateClasses --console=plain 2>&1 | grep -E "Duplicate class" | sort -u | head -40 || true
          echo "---- who brings them ----"
          gradle :app:dependencies --configuration directDebugRuntimeClasspath --console=plain 2>&1 | grep -iE "bouncycastle|zxing|jna|kotlin-stdlib|web3j" | sort -u | head -40 || true
